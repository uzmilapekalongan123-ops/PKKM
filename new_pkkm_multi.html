                        {/* LAPORAN TAB */}
                        {activeTab === 'laporan' && (
                            <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                                <div class="flex justify-between items-start border-b border-slate-200 pb-6">
                                    <div>
                                        <h2 class="text-2xl font-bold text-slate-800">Laporan Penilaian Kinerja Kepala Madrasah ({selectedYear})</h2>
                                        <p class="text-xs text-slate-500 mt-1">MTs Al Fatah Talun • Kepala Madrasah: Imam Mahmudi, M.Pd</p>
                                    </div>
                                    <button onClick={() => window.print()} class="bg-emerald-800 hover:bg-emerald-900 text-white font-semibold px-4 py-2 rounded-xl text-xs flex items-center gap-2 shadow-md">
                                        <i data-lucide="printer" class="w-4 h-4 text-amber-400"></i> Cetak Laporan Tahun {selectedYear}
                                    </button>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div class="p-6 rounded-2xl bg-gradient-to-br from-emerald-950 to-teal-900 text-white text-center flex flex-col justify-center">
                                        <p class="text-xs uppercase text-emerald-200 font-semibold tracking-wider">Nilai Akhir Kinerja Tahun {selectedYear}</p>
                                        <h3 class="text-5xl font-extrabold text-amber-400 mt-2">{stats.avgScore}</h3>
                                        <p class="text-xs text-emerald-100 mt-2 font-medium">Predikat: <b>SANGAT BAIK (A)</b></p>
                                    </div>
                                    <div class="p-6 rounded-2xl bg-slate-50 border border-slate-200 col-span-2 space-y-3 text-xs">
                                        <h4 class="font-bold text-slate-800 text-sm">Penyimpanan & Sinkronisasi Drive Resmi:</h4>
                                        <div class="p-4 bg-white rounded-xl border border-slate-200 space-y-2.5">
                                            <p class="font-semibold text-slate-700 flex items-center justify-between">
                                                <span>Folder Utama Drive PKKM:</span>
                                                <a href={DRIVE_FOLDER_URL} target="_blank" rel="noreferrer" class="font-mono text-emerald-700 underline inline-flex items-center gap-1 font-bold">
                                                    Buka Google Drive <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                                                </a>
                                            </p>
                                            <p class="text-slate-600">Status Kelengkapan: <b>{stats.verified} dari {stats.total} Dokumen Terverifikasi ({Math.round((stats.verified/stats.total)*100)}%)</b></p>
                                            <div class="w-full bg-slate-200 rounded-full h-2">
                                                <div class="bg-emerald-600 h-2 rounded-full" style={{ width: `${(stats.verified/stats.total)*100}%` }}></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="mt-6 border-t border-slate-200 pt-6">
                                    <h3 class="font-bold text-slate-800 text-sm mb-4">Ringkasan Skor Per Komponen Kinerja</h3>
                                    <div class="grid grid-cols-1 sm:grid-cols-5 gap-3">
                                        {['A', 'B', 'C', 'D', 'E'].map(komp => {
                                            const matchItems = currentItems.filter(i => i.unsur.startsWith(komp));
                                            const count = matchItems.length;
                                            const score = count > 0 ? (matchItems.reduce((acc, i) => acc + i.skor, 0) / count).toFixed(2) : '0.00';
                                            return (
                                                <div key={komp} class="p-4 bg-slate-50 rounded-xl border border-slate-200 text-center">
                                                    <span class="text-xs font-bold text-slate-500 uppercase">Komponen {komp}</span>
                                                    <p class="text-xl font-extrabold text-emerald-800 mt-1">{score}</p>
                                                    <span class="text-[10px] text-slate-400">{count} Indikator</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* UPLOAD MODAL SINKRONISASI DRIVE */}
                    {showUploadModal && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl space-y-5">
                                <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                                    <div>
                                        <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
                                            <i data-lucide="cloud-upload" class="w-5 h-5 text-emerald-600"></i>
                                            Unggah / Hubungkan Bukti Dukung ({selectedYear})
                                        </h3>
                                        <p class="text-[11px] text-slate-400 mt-0.5">Terhubung Langsung ke Google Drive PKKM</p>
                                    </div>
                                    <button onClick={() => setShowUploadModal(false)} class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
                                </div>

                                <div class="space-y-4 text-xs">
                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Target Indikator Penilaian</label>
                                        <textarea
                                            readOnly
                                            rows="2"
                                            value={selectedItemForUpload ? `${selectedItemForUpload.unsur.split('.')[0]} - ${selectedItemForUpload.indikator}` : `Indikator PKKM Tahun ${selectedYear}`}
                                            class="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-100 text-slate-600 font-medium text-xs leading-relaxed resize-none"
                                        />
                                    </div>

                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Nama Berkas Dokumen / File</label>
                                        <input 
                                            id="inputFileName"
                                            type="text" 
                                            placeholder={`Bukti_Fisik_PKKM_${selectedYear}_MTs_AlFatah.pdf`} 
                                            class="w-full p-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500" 
                                        />
                                    </div>

                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Link File / Folder Google Drive Spesifik</label>
                                        <input 
                                            id="inputCustomLink"
                                            type="text" 
                                            defaultValue={selectedItemForUpload ? selectedItemForUpload.driveLink : DRIVE_FOLDER_URL}
                                            class="w-full p-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-emerald-500 font-mono text-[11px]" 
                                        />
                                        <p class="text-[10px] text-slate-400 mt-1">Anda dapat menyesuaikan atau mengubah tautan folder Drive untuk indikator ini secara manual.</p>
                                    </div>

                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Unggah Langsung Ke Folder Google Drive</label>
                                        <a 
                                            href={selectedItemForUpload && selectedItemForUpload.driveLink ? selectedItemForUpload.driveLink : DRIVE_FOLDER_URL} 
                                            target="_blank" 
                                            rel="noreferrer"
                                            class="border-2 border-dashed border-emerald-300 bg-emerald-50/50 rounded-2xl p-5 text-center cursor-pointer hover:bg-emerald-50 transition-all block"
                                        >
                                            <i data-lucide="folder-plus" class="w-7 h-7 text-emerald-600 mx-auto mb-1"></i>
                                            <p class="font-bold text-emerald-900">Buka Folder Google Drive untuk Upload Berkas</p>
                                            <p class="text-[10px] text-emerald-700 mt-0.5">Klik di sini untuk mengunggah file langsung ke folder Drive resmi</p>
                                        </a>
                                    </div>
                                </div>

                                <div class="flex justify-end gap-3 pt-3 border-t border-slate-100">
                                    <button onClick={() => setShowUploadModal(false)} class="px-4 py-2 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50">
                                        Batal
                                    </button>
                                    <button 
                                        onClick={() => {
                                            const valName = document.getElementById('inputFileName').value;
                                            const valLink = document.getElementById('inputCustomLink').value;
                                            handleSaveFileUpload(valName, valLink);
                                        }} 
                                        class="px-5 py-2 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white text-xs font-bold shadow-md flex items-center gap-1.5"
                                    >
                                        <i data-lucide="save" class="w-3.5 h-3.5 text-amber-400"></i> Simpan Dokumen
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800">
                        <div class="max-w-7xl mx-auto px-4 text-center space-y-2">
                            <p>© Aplikasi Multi-Tahun (2025–2028) <b>SI-PKKM MTs Al Fatah Talun</b> • Integrasi Link Drive Berkas Dukung Presisi</p>
                            <p class="text-slate-500">
                                Kepala Madrasah: <b>Imam Mahmudi, M.Pd</b> • Folder Drive Utama: 
                                <a href={DRIVE_FOLDER_URL} target="_blank" rel="noreferrer" class="text-emerald-400 hover:underline ml-1">
                                    Link Drive Terhubung
                                </a>
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
